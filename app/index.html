<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>HIKARINAMI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-secondary-fixed": "#1b1c1c",
            "inverse-surface": "#2f3131",
            "error": "#ba1a1a",
            "background": "#f9f9f9",
            "on-primary-fixed": "#410003",
            "on-secondary-container": "#636262",
            "surface-tint": "#ba1a20",
            "on-surface-variant": "#5b403d",
            "surface-container-highest": "#e2e2e2",
            "on-tertiary-fixed": "#001f2a",
            "surface": "#f9f9f9",
            "surface-dim": "#dadada",
            "inverse-primary": "#ffb3ac",
            "surface-container-low": "#f3f3f3",
            "secondary": "#5f5e5e",
            "primary-fixed": "#ffdad6",
            "on-primary-fixed-variant": "#930010",
            "error-container": "#ffdad6",
            "surface-variant": "#e2e2e2",
            "on-error-container": "#93000a",
            "on-secondary-fixed-variant": "#474746",
            "on-primary": "#ffffff",
            "on-secondary": "#ffffff",
            "tertiary-fixed-dim": "#7bd1f8",
            "surface-bright": "#f9f9f9",
            "tertiary-container": "#00799c",
            "surface-container-lowest": "#ffffff",
            "outline": "#8f6f6c",
            "secondary-fixed-dim": "#c8c6c5",
            "outline-variant": "#e4beba",
            "primary-fixed-dim": "#ffb3ac",
            "on-tertiary": "#ffffff",
            "on-tertiary-container": "#e9f7ff",
            "tertiary-fixed": "#bee9ff",
            "primary": "#af101a",
            "on-error": "#ffffff",
            "inverse-on-surface": "#f1f1f1",
            "surface-container-high": "#e8e8e8",
            "tertiary": "#005f7b",
            "on-tertiary-fixed-variant": "#004d65",
            "secondary-container": "#e2dfde",
            "on-surface": "#1a1c1c",
            "primary-container": "#d32f2f",
            "on-background": "#1a1c1c",
            "on-primary-container": "#fff2f0",
            "surface-container": "#eeeeee",
            "secondary-fixed": "#e5e2e1"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Plus Jakarta Sans"],
            "label": ["Plus Jakarta Sans"]
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: max(884px, 100dvh);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .editorial-spacing { letter-spacing: -0.01em; }
    .label-spacing { letter-spacing: 0.05em; }

    /* Bottom sheet animation */
    .sheet-backdrop {
      animation: fadeIn 0.2s ease-out;
    }
    .sheet-panel {
      animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    /* Exit animations — applied via JS inline style so they override the entry class */
    @keyframes slideDown {
      from { transform: translateY(0); }
      to   { transform: translateY(100%); }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
  </style>
</head>
<body class="bg-background text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed">
  <div id="app"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
