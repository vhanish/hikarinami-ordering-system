<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>HIKARINAMI | Kitchen Dashboard</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "error": "#ba1a1a",
            "tertiary-container": "#00799c",
            "surface-container-lowest": "#ffffff",
            "inverse-on-surface": "#f1f1f1",
            "background": "#f9f9f9",
            "on-tertiary-fixed-variant": "#004d65",
            "surface-bright": "#f9f9f9",
            "inverse-primary": "#ffb3ac",
            "on-background": "#1a1c1c",
            "surface-container-high": "#e8e8e8",
            "secondary-fixed": "#e5e2e1",
            "on-tertiary": "#ffffff",
            "on-error": "#ffffff",
            "on-primary-fixed-variant": "#930010",
            "surface-container-low": "#f3f3f3",
            "outline": "#8f6f6c",
            "secondary-container": "#e2dfde",
            "on-primary": "#ffffff",
            "inverse-surface": "#2f3131",
            "primary": "#af101a",
            "surface-tint": "#ba1a20",
            "on-secondary": "#ffffff",
            "tertiary-fixed-dim": "#7bd1f8",
            "surface-variant": "#e2e2e2",
            "tertiary-fixed": "#bee9ff",
            "tertiary": "#005f7b",
            "on-primary-fixed": "#410003",
            "on-primary-container": "#fff2f0",
            "error-container": "#ffdad6",
            "on-secondary-fixed-variant": "#474746",
            "primary-fixed": "#ffdad6",
            "surface-container-highest": "#e2e2e2",
            "outline-variant": "#e4beba",
            "on-surface": "#1a1c1c",
            "secondary-fixed-dim": "#c8c6c5",
            "primary-fixed-dim": "#ffb3ac",
            "surface-container": "#eeeeee",
            "on-surface-variant": "#5b403d",
            "on-secondary-container": "#636262",
            "secondary": "#5f5e5e",
            "on-secondary-fixed": "#1b1c1c",
            "on-error-container": "#93000a",
            "primary-container": "#d32f2f",
            "on-tertiary-fixed": "#001f2a",
            "on-tertiary-container": "#e9f7ff",
            "surface": "#f9f9f9",
            "surface-dim": "#dadada"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Plus Jakarta Sans"],
            "label": ["Plus Jakarta Sans"]
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #f9f9f9; }
    ::-webkit-scrollbar-thumb { background: #e8e8e8; border-radius: 10px; }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen">

  <!-- TopAppBar -->
  <header class="fixed top-0 w-full z-50 bg-[#f9f9f9]/80 backdrop-blur-md font-['Plus_Jakarta_Sans'] antialiased shadow-[0_24px_24px_rgba(26,28,28,0.04)]">
    <div class="flex justify-between items-center px-8 py-4 w-full">
      <div class="text-[1.125rem] font-bold tracking-tight text-[#1a1c1c]">HIKARINAMI</div>
      <nav class="hidden md:flex gap-8">
        <a data-view="live"    class="text-[#af101a] font-semibold border-b-2 border-[#af101a] hover:text-[#1a1c1c] transition-colors duration-200 cursor-pointer active:opacity-70" href="#">Live Orders</a>
        <a data-view="history" class="text-[#5f5e5e] font-medium hover:text-[#1a1c1c] transition-colors duration-200 cursor-pointer active:opacity-70" href="#">Order History</a>
        <a data-view="stats"   class="text-[#5f5e5e] font-medium hover:text-[#1a1c1c] transition-colors duration-200 cursor-pointer active:opacity-70" href="#">Kitchen Stats</a>
      </nav>
      <div class="flex items-center gap-6">
        <span class="material-symbols-outlined text-on-surface cursor-pointer active:opacity-70">notifications</span>
        <span class="material-symbols-outlined text-on-surface cursor-pointer active:opacity-70">settings</span>
      </div>
    </div>
    <div class="bg-[#e8e8e8] h-[1px] w-full"></div>
  </header>

  <main class="pt-24 pb-12 px-8">
    <!-- Dashboard Header -->
    <div class="flex justify-between items-end mb-10">
      <div>
        <h1 id="page-title" class="text-[2.0rem] font-bold tracking-[-0.02em] text-on-background leading-tight">Kitchen Live Board</h1>
        <p id="active-order-count" class="text-secondary text-sm mt-1">Loading…</p>
      </div>
      <div id="filter-bar" class="flex gap-4">
        <div class="flex items-center bg-surface-container-high px-4 py-2 rounded-lg">
          <span class="text-label-sm font-bold uppercase tracking-wider text-secondary mr-3">Filter:</span>
          <select id="status-filter" class="bg-transparent border-none focus:ring-0 text-sm font-semibold text-on-background p-0">
            <option value="all">All</option>
            <option value="new">New</option>
            <option value="preparing">Preparing</option>
            <option value="ready">Ready</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Orders grid — populated by kitchen.js -->
    <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-8">
      <div class="col-span-full flex flex-col items-center justify-center py-24 text-center">
        <p class="text-secondary text-sm">Loading orders…</p>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation (mobile/tablet) -->
  <div class="md:hidden fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant/10 px-8 py-3 flex justify-around items-center z-50">
    <div data-view="live" class="flex flex-col items-center gap-1 text-primary cursor-pointer">
      <span class="material-symbols-outlined">restaurant</span>
      <span class="text-[10px] font-bold uppercase tracking-wider">Orders</span>
    </div>
    <div data-view="history" class="flex flex-col items-center gap-1 text-secondary cursor-pointer">
      <span class="material-symbols-outlined">history</span>
      <span class="text-[10px] font-bold uppercase tracking-wider">History</span>
    </div>
    <div data-view="stats" class="flex flex-col items-center gap-1 text-secondary cursor-pointer">
      <span class="material-symbols-outlined">bar_chart</span>
      <span class="text-[10px] font-bold uppercase tracking-wider">Stats</span>
    </div>
  </div>

  <script type="module" src="src/kitchen.js"></script>
</body>
</html>
