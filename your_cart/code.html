<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HIKARINAMI - Your Order</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed-variant": "#930010",
                    "tertiary-fixed": "#bee9ff",
                    "on-primary": "#ffffff",
                    "secondary-fixed-dim": "#c8c6c5",
                    "on-primary-fixed": "#410003",
                    "inverse-on-surface": "#f1f1f1",
                    "primary-fixed-dim": "#ffb3ac",
                    "on-secondary": "#ffffff",
                    "surface-bright": "#f9f9f9",
                    "background": "#f9f9f9",
                    "surface-container": "#eeeeee",
                    "tertiary-container": "#00799c",
                    "on-surface-variant": "#5b403d",
                    "surface-variant": "#e2e2e2",
                    "primary": "#af101a",
                    "outline-variant": "#e4beba",
                    "on-tertiary-fixed": "#001f2a",
                    "tertiary-fixed-dim": "#7bd1f8",
                    "on-tertiary-container": "#e9f7ff",
                    "on-background": "#1a1c1c",
                    "primary-container": "#d32f2f",
                    "inverse-surface": "#2f3131",
                    "surface-container-highest": "#e2e2e2",
                    "secondary": "#5f5e5e",
                    "surface-container-low": "#f3f3f3",
                    "on-secondary-fixed-variant": "#474746",
                    "on-primary-container": "#fff2f0",
                    "primary-fixed": "#ffdad6",
                    "on-error": "#ffffff",
                    "error": "#ba1a1a",
                    "surface": "#f9f9f9",
                    "secondary-fixed": "#e5e2e1",
                    "surface-dim": "#dadada",
                    "on-tertiary": "#ffffff",
                    "outline": "#8f6f6c",
                    "on-secondary-fixed": "#1b1c1c",
                    "surface-tint": "#ba1a20",
                    "inverse-primary": "#ffb3ac",
                    "on-secondary-container": "#636262",
                    "on-tertiary-fixed-variant": "#004d65",
                    "on-error-container": "#93000a",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#e8e8e8",
                    "secondary-container": "#e2dfde",
                    "error-container": "#ffdad6",
                    "on-surface": "#1a1c1c",
                    "tertiary": "#005f7b"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#f9f9f9]/80 backdrop-blur-md flex items-center justify-center h-16 px-6 w-full">
<h1 class="text-[#1a1c1c] text-base font-medium tracking-normal">HIKARINAMI</h1>
</header>
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto">
<!-- Title -->
<section class="mb-12">
<h2 class="text-[2.0rem] font-extrabold tracking-[-0.02em] text-on-surface">Your Order</h2>
</section>
<!-- Cart Items List (Text-Only Editorial Style) -->
<section class="space-y-6 mb-16">
<!-- Item 1 -->
<div class="flex items-start justify-between">
<div class="flex flex-col gap-1">
<span class="text-xs font-medium tracking-widest text-secondary uppercase">RAMEN</span>
<h3 class="text-[0.875rem] font-semibold text-on-surface">Tonkotsu Ramen</h3>
<p class="text-[0.6875rem] text-secondary">Extra Chashu Pork, Spice Level: Mild</p>
</div>
<div class="text-[0.875rem] font-bold text-primary-container">$21.00</div>
</div>
<!-- Item 2 -->
<div class="flex items-start justify-between">
<div class="flex flex-col gap-1">
<span class="text-xs font-medium tracking-widest text-secondary uppercase">STARTER</span>
<h3 class="text-[0.875rem] font-semibold text-on-surface">Salmon Nigiri</h3>
<p class="text-[0.6875rem] text-secondary"></p>
</div>
<div class="text-[0.875rem] font-bold text-primary-container">$8.00</div>
</div>
<!-- Item 3 -->
<div class="flex items-start justify-between">
<div class="flex flex-col gap-1">
<span class="text-xs font-medium tracking-widest text-secondary uppercase">DRINK</span>
<h3 class="text-[0.875rem] font-semibold text-on-surface">2x Diet Coke</h3>
<p class="text-[0.6875rem] text-secondary">$2.50 each</p>
</div>
<div class="text-[0.875rem] font-bold text-primary-container">$5.00</div>
</div></section>
<!-- Summary Section -->
<section class="bg-surface-container-low p-8 rounded-lg space-y-4">
<div class="flex justify-between items-center text-[0.6875rem] font-medium tracking-widest text-secondary uppercase">
<span>Subtotal</span>
<span class="text-on-surface">$34.00</span>
</div>
<div class="flex justify-between items-center text-[0.6875rem] font-medium tracking-widest text-secondary uppercase">
<span>HST (13%)</span>
<span class="text-on-surface">$4.42</span>
</div>
<!-- Visual Break using Negative Space/Tonal Shift -->
<div class="pt-6 mt-6 border-t border-outline-variant/20">
<div class="flex justify-between items-end">
<span class="text-[0.6875rem] font-bold tracking-widest text-on-surface uppercase mb-1">Total</span>
<span class="text-[1.375rem] font-extrabold tracking-[-0.01em] text-primary-container leading-none">$38.42</span>
</div>
</div>
</section>
<!-- Action Button -->
<div class="mt-12">
<button class="w-full bg-primary-container text-white font-semibold py-4 px-6 rounded-lg shadow-[0px_-4px_24px_0px_rgba(26,28,28,0.04)] hover:opacity-90 transition-opacity">
                Place Order
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-4 bg-[#f9f9f9] shadow-[0px_-4px_24px_0px_rgba(26,28,28,0.04)] z-50">
<!-- Menu Link -->
<a class="flex flex-col items-center justify-center text-[#5f5e5e] hover:text-[#af101a] transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="restaurant_menu">restaurant_menu</span>
<span class="font-['Plus_Jakarta_Sans'] text-[0.6875rem] font-medium tracking-widest uppercase mt-1">Menu</span>
</a>
<!-- Cart Link (Active State) -->
<a class="flex flex-col items-center justify-center text-[#af101a] scale-105 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="shopping_cart" style="font-variation-settings: 'FILL' 1;">shopping_cart</span>
<span class="font-['Plus_Jakarta_Sans'] text-[0.6875rem] font-bold tracking-widest uppercase mt-1">Cart</span>
</a>
<!-- Orders Link -->
<a class="flex flex-col items-center justify-center text-[#5f5e5e] hover:text-[#af101a] transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-['Plus_Jakarta_Sans'] text-[0.6875rem] font-medium tracking-widest uppercase mt-1">Orders</span>
</a>
</nav>
</body></html>
